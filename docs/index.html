<style>
:root{--c:#7C3AED;--g:#16A34A;--y:#F59E0B;--r:#DC2626;--bg:#F7F7FB;--bg2:#FFFFFF;--t1:#14142B;--t2:#6B7280;--t3:#B0B3C0;--bo:rgba(124,58,237,.15);--boh:rgba(124,58,237,.35);--ink:rgba(20,20,43,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);font-family:'Space Grotesk','PingFang TC','Noto Sans TC',-apple-system,sans-serif;overflow-x:hidden;line-height:1.5;max-width:480px;margin:0 auto}
body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 32% at 12% -8%,rgba(124,58,237,.08),transparent 60%),radial-gradient(ellipse 45% 35% at 100% 6%,rgba(245,158,11,.06),transparent 60%);pointer-events:none}

/* ── PROGRESS BAR ── */
#pb{position:fixed;top:0;left:0;height:2px;z-index:9999;width:0%;background:linear-gradient(90deg,var(--c),var(--g),var(--c));background-size:200%;animation:pbf 1.2s linear infinite;box-shadow:0 0 10px rgba(124,58,237,.4);transition:width .4s ease,opacity .4s ease}
@keyframes pbf{to{background-position:-200%}}

/* ── HEADER ── */
#hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--ink)}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.logo-mark{display:flex;align-items:center;gap:8px}
.logo-icon{font-size:20px;position:relative}
.logo-text{font-family:'Oswald','Space Grotesk','PingFang TC','Noto Sans TC',-apple-system,sans-serif;font-size:16px;font-weight:700;letter-spacing:.2px}
.logo-text span{color:var(--c)}
.pro-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;background:rgba(245,158,11,.12);color:var(--y);border:1px solid rgba(245,158,11,.35);letter-spacing:1px}
.hdr-tabs{display:flex;overflow-x:auto;padding:0 12px 10px;gap:4px;scrollbar-width:none}
.hdr-tabs::-webkit-scrollbar{display:none}
.htab{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid transparent;background:transparent;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent;min-height:44px;display:inline-flex;align-items:center}
.htab.on{background:var(--c);color:#fff;border-color:var(--c)}
.pg{display:none}
.pg.on{display:block}
.content{position:relative;z-index:1;padding:12px 12px 120px}

/* ── ANIMATIONS ── */
@keyframes pa-spin{to{transform:rotate(360deg)}}
@keyframes sks{to{background-position:-200%}}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes tks{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes fi-in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.7)}}

/* ── SCROLL REVEAL ── */
.fi{transition:opacity .4s ease,transform .4s ease}
.fi.on{opacity:1;transform:none}

/* ── SKELETON ── */
.sk{border-radius:8px;background:linear-gradient(90deg,rgba(20,20,43,.06) 25%,rgba(20,20,43,.12) 50%,rgba(20,20,43,.06) 75%);background-size:200% 100%;animation:sks 1.5s infinite}

/* ── DISCLAIMER ── */
.disc{border-radius:12px;padding:12px 14px;background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.22);display:flex;gap:10px;margin-bottom:14px}
.disc-body{font-size:11px;color:var(--t2);line-height:1.6}
.disc-title{font-size:12px;font-weight:700;color:var(--y);margin-bottom:3px}

/* ── HERO TOP-EDGE CARD ── */
.te-card{border-radius:20px;overflow:hidden;margin-bottom:14px;position:relative;background:linear-gradient(180deg,#F3EEFF,#FFFFFF 65%);border:1px solid rgba(124,58,237,.18);box-shadow:0 2px 8px rgba(20,20,43,.04),0 10px 26px rgba(20,20,43,.07)}
.te-card::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 55% 60% at 100% 0%,rgba(124,58,237,.08),transparent);pointer-events:none}
.te-body{position:relative;z-index:1;padding:16px}
.te-label{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--c);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid rgba(20,20,43,.08)}
.te-fire{font-size:14px}
.te-content{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.te-left{flex:1;min-width:0}
.te-pick{font-family:'Oswald','Space Grotesk','PingFang TC','Noto Sans TC',-apple-system,sans-serif;font-size:23px;font-weight:700;color:var(--t1);line-height:1.15;margin-bottom:12px;word-break:break-word}
.te-pick span{color:var(--c)}
.te-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.te-stat{background:#FFFFFF;border-radius:10px;padding:8px 10px;border:1px solid rgba(20,20,43,.07)}
.te-sl{font-size:9px;color:var(--t2);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.te-sv{font-size:17px;font-weight:800;line-height:1}
.te-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;background:var(--c);border:1px solid var(--c);color:#fff;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;transition:all .2s;min-height:44px}
.te-btn:hover{background:#6D28D9;box-shadow:0 4px 14px rgba(124,58,237,.3)}
.te-right{width:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.te-logo{width:72px;height:72px;border-radius:50%;background:var(--bg);border:1px solid rgba(20,20,43,.08);display:flex;align-items:center;justify-content:center;overflow:hidden}
.te-logo img{width:54px;height:54px;object-fit:contain}
.te-logo-fb{font-size:24px;font-weight:800;color:var(--t2)}
.te-meta{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--bg);border-top:1px solid rgba(20,20,43,.06);font-size:11px;color:var(--t2);flex-wrap:wrap}
.te-meta-item{display:flex;align-items:center;gap:4px}
.tier-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.5px}

/* ── QUICK STATS BAR ── */
.qs-bar{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
.qs-bar::-webkit-scrollbar{display:none}
.qs-box{flex-shrink:0;background:#FFFFFF;border:1px solid rgba(20,20,43,.07);box-shadow:0 1px 3px rgba(20,20,43,.04);border-radius:12px;padding:10px 12px;min-width:80px;text-align:center}
.qs-box:first-child{border-color:rgba(22,163,74,.25);background:rgba(22,163,74,.05)}
.qs-lbl{font-size:9px;color:var(--t2);font-weight:600;letter-spacing:.5px;white-space:nowrap}
.qs-val{font-size:16px;font-weight:800;color:var(--t1);margin-top:2px;white-space:nowrap}
.qs-sub{font-size:9px;color:var(--t2);margin-top:1px;white-space:nowrap}

/* ── SECTION HEADER ── */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:18px}
.sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--t1)}
.sec-dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.live-dot{background:var(--r);box-shadow:0 0 8px rgba(220,38,38,.5);animation:lp 1s ease-in-out infinite}
.sec-count{font-size:11px;color:var(--t2);background:var(--bg);padding:2px 8px;border-radius:10px}

/* ── LIVE GAMES ── */
.live-card{background:#FFFFFF;border:1px solid rgba(20,20,43,.07);box-shadow:0 1px 3px rgba(20,20,43,.04);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative}
.live-card.has-bet{border-color:rgba(22,163,74,.3);background:rgba(22,163,74,.04)}
.live-score{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.live-team{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.live-logo{width:36px;height:36px;object-fit:contain}
.live-tn{font-size:12px;font-weight:700;color:var(--t1)}
.live-runs{font-size:28px;font-weight:800;line-height:1}
.live-mid{display:flex;flex-direction:column;align-items:center;gap:4px}
.live-dash{font-size:18px;color:var(--t2);font-weight:300}
.live-inn{font-size:10px;color:var(--y);font-weight:700;background:rgba(245,158,11,.12);padding:2px 8px;border-radius:10px}
.live-totals{display:flex;gap:6px;flex-wrap:wrap}
.live-chip{font-size:10px;padding:3px 8px;border-radius:8px;background:var(--bg);color:var(--t2);border:1px solid rgba(20,20,43,.07)}
.live-chip.bet{background:rgba(22,163,74,.1);color:var(--g);border-color:rgba(22,163,74,.25)}
.live-reason{font-size:11px;color:var(--t2);margin-top:6px;padding-top:6px;border-top:1px solid rgba(20,20,43,.06)}

/* ── FILTER TABS ── */
.filter-bar{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:7px 16px;border-radius:20px;border:1px solid rgba(20,20,43,.12);background:#FFFFFF;color:var(--t2);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;min-height:44px;display:inline-flex;align-items:center}
.ftab.on{background:var(--c);color:#fff;border-color:var(--c)}

/* ── GAME CARDS ── */
.gc{border-radius:18px;margin-bottom:14px;overflow:hidden;position:relative;background:#FFFFFF;border:1px solid rgba(20,20,43,.08);box-shadow:0 1px 2px rgba(20,20,43,.04),0 8px 20px rgba(20,20,43,.05);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.gc:active{transform:scale(.985);box-shadow:0 3px 10px rgba(20,20,43,.15)}
.gc{border-left:3px solid rgba(22,163,74,.4)}
.gc.tier-gold{border-color:rgba(245,158,11,.35);border-left:3px solid var(--y)}
@media(hover:hover){.gc:hover{border-color:rgba(124,58,237,.25);box-shadow:0 12px 30px rgba(20,20,43,.09)}}
.gc-wp-pct,.gm-val,.te-sv,.qs-val,.live-runs,.bar-val,.gc-ab,.bt-badge,.trend-val,.rh-price,.pro-badge{font-family:'Oswald','Space Grotesk','PingFang TC','Noto Sans TC',-apple-system,sans-serif;font-variant-numeric:tabular-nums}
.gc-hdr{display:table;width:100%;border-bottom:1px solid rgba(20,20,43,.06);background:var(--bg)}
.gc-hdr-l{display:table-cell;padding:8px 0 8px 14px;vertical-align:middle}
.gc-hdr-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gc-top-tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--y);background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.3)}
.gc-live-badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.3px;color:var(--r);background:rgba(220,38,38,.1);border:1px solid rgba(220,38,38,.3)}
.live-dot-sm{width:5px;height:5px;border-radius:50%;background:var(--r);animation:pulse-dot 1s ease-in-out infinite;flex-shrink:0}
.gc-time{display:table-cell;padding:8px 14px 8px 8px;vertical-align:middle;white-space:nowrap;font-size:11px;color:var(--t2);font-weight:600;width:1px}
.gc-num{font-size:10px;color:var(--t2);background:var(--bg);padding:2px 7px;border-radius:8px;flex-shrink:0}

/* teams row */
.gc-teams{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px;gap:8px}
.gc-team{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1}
.gc-tl{width:44px;height:44px;object-fit:contain}
.gc-ab{font-size:13px;font-weight:800;color:var(--t1);letter-spacing:.5px}
.gc-cn{font-size:11px;color:var(--t2);font-weight:500}
.gc-vs{font-size:11px;font-weight:800;color:var(--t3);letter-spacing:2px;flex-shrink:0}

/* win probability row */
.gc-wp{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;gap:4px}
.gc-wp-side{display:flex;flex-direction:column;align-items:center;flex:1}
.gc-wp-pct{font-size:18px;font-weight:800;line-height:1}
.gc-wp-lbl{font-size:9px;color:var(--t2);font-weight:600;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
.wp-donut{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.wp-pcts{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800}
.wp-vs{color:var(--t3);font-size:9px}

/* pitcher row */
.gc-pit{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--bg);border-top:1px solid rgba(20,20,43,.05);border-bottom:1px solid rgba(20,20,43,.05);gap:6px}
.gc-pit-side{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.pit-av{position:relative;width:44px;height:44px;flex-shrink:0}
.pit-inner{position:absolute;inset:0;border-radius:6px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pit-init{font-size:13px;font-weight:800;letter-spacing:-.5px}
.pit-inner img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.pit-name{font-size:10px;font-weight:700;color:var(--t1);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.pit-hand{display:inline-block;font-size:8px;font-weight:800;color:var(--t2);background:rgba(20,20,43,.07);border-radius:4px;padding:0 3px;vertical-align:middle}
.pit-stats{font-size:9px;color:var(--t2);text-align:center;line-height:1.5}
.pit-trend{font-size:8px;font-weight:800;letter-spacing:.2px;margin-top:1px}
.pit-vs{font-size:10px;font-weight:700;color:var(--t3);flex-shrink:0}

/* lineup (打線) */
.gc-lu-toggle{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;border-bottom:1px solid rgba(20,20,43,.05);-webkit-tap-highlight-color:transparent;min-height:32px}
.gc-lu-toggle:hover{color:var(--t1)}
.gc-lu-toggle:focus-visible,.gc-adv-toggle:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.gc-lu-arrow{font-size:9px;transition:transform .2s}
.gc-lineup{display:flex;gap:4px;padding:10px 14px;background:var(--bg);border-bottom:1px solid rgba(20,20,43,.05)}
.lu-col{flex:1;min-width:0}
.lu-team{font-size:10px;font-weight:800;color:var(--t2);letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.lu-row{display:flex;align-items:baseline;gap:6px;font-size:11px;padding:2px 0;color:var(--t1)}
.lu-ord{color:var(--t3);width:14px;flex-shrink:0;font-weight:700}
.lu-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lu-pos{color:var(--t2);font-size:9px;flex-shrink:0}

/* advanced stats（進階數據）*/
.gc-adv-toggle{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;font-size:11px;font-weight:700;color:var(--t2);cursor:pointer;border-bottom:1px solid rgba(20,20,43,.05);-webkit-tap-highlight-color:transparent;min-height:32px}
.gc-adv-toggle:hover{color:var(--t1)}
.gc-adv{border-bottom:1px solid rgba(20,20,43,.05)}
.adv-game{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(20,20,43,.06)}
.adv-teams{display:flex;gap:1px;background:rgba(20,20,43,.06);border-top:1px solid rgba(20,20,43,.05)}
.adv-col{flex:1;min-width:0;background:var(--bg)}
.adv-col-hdr{font-size:10px;font-weight:800;color:var(--t1);letter-spacing:.5px;padding:8px 12px 6px;border-bottom:1px solid rgba(20,20,43,.06)}
.adv-item{background:var(--bg);padding:6px 12px;display:flex;flex-direction:column;gap:2px}
.adv-lbl{font-size:9px;color:var(--t2);font-weight:700;letter-spacing:.3px}
.adv-val{font-size:12px;color:var(--t1);font-weight:700}

/* bet row */
.gc-bet{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
.bt-badge{padding:3px 9px;border-radius:7px;font-size:11px;font-weight:800;letter-spacing:.5px;flex-shrink:0}
.bt-badge.ML{background:rgba(124,58,237,.12);color:var(--c);border:1px solid rgba(124,58,237,.3)}
.bt-badge.RL{background:rgba(245,158,11,.12);color:var(--y);border:1px solid rgba(245,158,11,.3)}
.bt-badge.TOT{background:rgba(22,163,74,.12);color:var(--g);border:1px solid rgba(22,163,74,.25)}
.bet-label{font-size:13px;font-weight:700;color:var(--t1);flex:1;min-width:0}
.bet-odds{font-size:14px;font-weight:800;color:var(--g)}
.bet-bk{font-size:10px;color:var(--t2);padding:2px 6px;background:var(--bg);border-radius:6px;white-space:nowrap}

/* bars */
.gc-bars{padding:10px 14px;border-top:1px solid rgba(20,20,43,.06)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{font-size:9px;color:var(--t2);font-weight:700;letter-spacing:.4px;width:84px;flex-shrink:0;text-transform:uppercase}
.bar-track{flex:1;height:5px;border-radius:3px;background:rgba(20,20,43,.08);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:3px;transition:width 1.2s cubic-bezier(.22,1,.36,1)}
.bar-val{font-size:10px;font-weight:700;width:32px;text-align:right;flex-shrink:0}

/* dual (away vs home) bars */
.bar-row.dual .bar-lbl{width:60px}
.bar-val-l{text-align:left!important}
.dual-track{position:relative}
.bar-fill-l{position:absolute;right:50%;top:0;height:100%;border-radius:3px 0 0 3px}
.bar-fill-r{position:absolute;left:50%;top:0;height:100%;border-radius:0 3px 3px 0}
.dual-track::after{content:'';position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(20,20,43,.15);transform:translateX(-.5px)}

/* metrics */
.gc-metrics{display:flex;gap:0;border-top:1px solid rgba(20,20,43,.06)}
.gc-metric{flex:1;padding:10px 6px;text-align:center;border-right:1px solid rgba(20,20,43,.06)}
.gc-metric:last-child{border-right:none}
.gm-lbl{font-size:8px;color:var(--t2);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.gm-val{font-size:15px;font-weight:800}

/* predicted score */

.trend-tip.on{opacity:1}

/* ── RECENT HISTORY ── */

<script>
// ── CONSTANTS ──────────────────────────────────────────
var TEAM_ID={'運動家':133,'太空人':117,'藍鳥':141,'勇士':144,'釀酒人':158,'紅雀':138,'小熊':112,'響尾蛇':109,'道奇':119,'巨人':137,'守護者':114,'水手':136,'馬林魚':146,'大都會':121,'國民':120,'金鶯':110,'教士':135,'費城人':143,'海盜':134,'遊騎兵':140,'光芒':139,'紅襪':111,'紅人':113,'落磯':115,'皇家':118,'老虎':116,'雙城':142,'白襪':145,'洋基':147,'天使':108};
var TEAM_ABBR={'運動家':'OAK','太空人':'HOU','藍鳥':'TOR','勇士':'ATL','釀酒人':'MIL','紅雀':'STL','小熊':'CHC','響尾蛇':'ARI','道奇':'LAD','巨人':'SF','守護者':'CLE','水手':'SEA','馬林魚':'MIA','大都會':'NYM','國民':'WSH','金鶯':'BAL','教士':'SD','費城人':'PHI','海盜':'PIT','遊騎兵':'TEX','光芒':'TB','紅襪':'BOS','紅人':'CIN','落磯':'COL','皇家':'KC','老虎':'DET','雙城':'MIN','白襪':'CWS','洋基':'NYY','天使':'LAA'};
var BM={'獨贏':'ML','讓分':'RL','大小分':'TOT'};
var TC={
  '💎 強注':{l:'💎 強注',c:'#F59E0B',bg:'rgba(245,158,11,0.12)'},
  '🔥 強力':{l:'💎 強注',c:'#F59E0B',bg:'rgba(245,158,11,0.12)'},
  '⭐ 穩定':{l:'⭐ 穩注',c:'#16A34A',bg:'rgba(22,163,74,0.1)'}
};

var _data=null, _allPicks=[], _curFilter='all', _curPage=0, _liveByKey={};

// 把 live_games 依「客隊|主隊」中文名做成查找表，讓推薦卡片能疊上即時比分角標
function buildLiveLookup(liveGames){
  var m={};
  (liveGames||[]).forEach(function(g){m[(g.away_cn||'')+'|'+(g.home_cn||'')]=g});
  return m;
}
function liveGameFor(pick){
  return _liveByKey[(pick.away_cn||'')+'|'+(pick.home_cn||'')]||null;
}

// ── UTILS ──────────────────────────────────────────────
function tid(cn){return TEAM_ID[cn]||null}
function abbr(s){return s?(TEAM_ABBR[s]||s.slice(0,3).toUpperCase()):'?'}
function logoUrl(cn){var id=tid(cn);return id?'https://www.mlbstatic.com/team-logos/'+id+'.svg':null}
function cdnUrl(id){return 'https://img.mlbstatic.com/mlb-photos/image/upload/d_people:generic:headshot:67:current.png/w_200,h_200,c_thumb,g_face/v1/people/'+id+'/headshot/67/current'}
function fmtOddsUS(dec){if(!dec||dec<1)return '';var u=dec>=2?Math.round((dec-1)*100):Math.round(-100/(dec-1));return u>=0?'+'+u:''+u}
function kelly(edge,odds){if(!edge||!odds||odds<=1)return '--';var p=edge/100;var q=1-p;var b=odds-1;var k=((b*p-q)/b)*100;return k>0?(k.toFixed(1)+'%'):'--'}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function safeNum(v,d){return (v!=null&&!isNaN(v))?Number(v):d}

// ── LOGO IMG ──────────────────────────────────────────
function logoImg(cn,size){
  var url=logoUrl(cn);
  if(url) return '<img src="'+url+'" width="'+size+'" height="'+size+'" alt="'+cn+'" style="object-fit:contain" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" >'
    +'<div style="display:none;width:'+size+'px;height:'+size+'px;align-items:center;justify-content:center;font-size:'+(size*0.38)+'px;font-weight:800;color:var(--t2)">'+abbr(cn)+'</div>';
  return '<div style="width:'+size+'px;height:'+size+'px;display:flex;align-items:center;justify-content:center;font-size:'+(size*0.38)+'px;font-weight:800;color:var(--t2)">'+abbr(cn)+'</div>';
}

// ── WIN PROBABILITY DONUT ──────────────────────────────
function wpDonut(awayPct,homePct,awayAb,homeAb){
  var size=84,r=33;
  var circ=2*Math.PI*r;
  var awayArc=circ*(awayPct/100);
  var homeArc=circ-awayArc;
  var offset=circ*0.25;
  var awayWin=awayPct>=homePct;
  var bigPct=awayWin?awayPct:homePct;
  var bigAb=awayWin?awayAb:homeAb;
  var awayC=awayPct>55?'var(--g)':awayPct>50?'var(--c)':'var(--t3)';
  var homeC=homePct>55?'var(--g)':homePct>50?'var(--c)':'var(--t3)';
  return '<div class="wp-donut">'
    +'<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'
      +'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="rgba(20,20,43,.08)" stroke-width="7"/>'
      +'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+awayC+'" stroke-width="7"'
        +' stroke-dasharray="'+awayArc+' '+homeArc+'" stroke-dashoffset="'+offset+'"'
        +' class="wp-arc" style="transition:stroke-dashoffset 1.2s cubic-bezier(.22,1,.36,1)"/>'
      +'<circle cx="42" cy="42" r="'+r+'" fill="none" stroke="'+homeC+'" stroke-width="7"'
        +' stroke-dasharray="'+homeArc+' '+awayArc+'" stroke-dashoffset="'+(offset-awayArc)+'"'
        +'/>'
      +'<text x="42" y="39" text-anchor="middle" fill="#14142B" font-size="17" font-weight="800" font-family="Space Grotesk">'+bigPct+'%</text>'
      +'<text x="42" y="54" text-anchor="middle" fill="rgba(20,20,43,.45)" font-size="8" font-weight="700">'+bigAb+'</text>'
    +'</svg>'
    +'<div class="wp-pcts"><span style="color:'+awayC+'">'+awayPct+'%</span><span class="wp-vs">VS</span><span style="color:'+homeC+'">'+homePct+'%</span></div>'
  +'</div>';
}

// ── PITCHER AVATAR ─────────────────────────────────────
function pitcherAv(name,side){
  var initials=name?name.trim().split(/\s+/).map(function(w){return w[0]||''}).join('').slice(0,2).toUpperCase():'??';
  var tc=side==='a'?'var(--c)':'var(--g)';
  return '<div class="pit-av" data-pname="'+(name||'')+'" data-side="'+side+'">'
    +'<div class="pit-inner" style="background:#F7F7FB"><span class="pit-init" style="color:'+tc+'">'+initials+'</span></div>'
  +'</div>';
}

// ── MINI CHARTS ────────────────────────────────────────
function monteCarloChart(edge,conf){
  var pts=20,h=44,w=130;
  var mid=h/2;
  var data=[];
  for(var i=0;i<pts;i++){
    var base=mid-(edge||10)/3;
    var noise=(Math.random()-0.5)*12;
    var trend=-(i/pts)*8;
    data.push(clamp(base+noise+trend,4,h-4));
  }
  var path='M ';
  data.forEach(function(y,i){path+=(i*(w/(pts-1)))+','+y+' '});
  var fillPath=path+'L '+w+','+h+' L 0,'+h+' Z';
  return '<div class="chart-box">'
    +'<div class="chart-title">MONTE CARLO ANALYSIS</div>'
    +'<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'
      +'<defs><linearGradient id="mcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--c)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--c)" stop-opacity="0"/></linearGradient></defs>'
      +'<path d="'+fillPath+'" fill="url(#mcg)"/>'
      +'<polyline points="'+data.map(function(y,i){return (i*(w/(pts-1)))+','+y}).join(' ')+'" fill="none" stroke="var(--c)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'</svg>'
  +'</div>';
}

function runsDistChart(predA,predH){
  var bars=[predA||3,predH||4,(predA+predH)||7];
  var cols=['var(--c)','var(--g)','var(--y)'];
  var lbls=['客','主','總'];
  var maxV=Math.max.apply(null,bars)*1.3||1;
  var bw=20,gap=12,h=44,total=bars.length*(bw+gap)-gap;
  var svg='<svg width="'+total+'" height="'+h+'" viewBox="0 0 '+total+' '+h+'">';
  bars.forEach(function(v,i){
    var bh=Math.max(2,(v/maxV)*(h-12));
    var x=i*(bw+gap);
    svg+='<rect x="'+x+'" y="'+(h-bh)+'" width="'+bw+'" height="'+bh+'" rx="3" fill="'+cols[i]+'" opacity=".8"/>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(h-bh-3)+'" text-anchor="middle" fill="#14142B" font-size="9" font-weight="700">'+v.toFixed(1)+'</text>';
    svg+='<text x="'+(x+bw/2)+'" y="'+(h+12)+'" text-anchor="middle" fill="rgba(20,20,43,.45)" font-size="8">'+lbls[i]+'</text>';
  });
  svg+='</svg>';
  return '<div class="chart-box">'
    +'<div class="chart-title">RUNS DISTRIBUTION</div>'
    +'<div style="display:flex;justify-content:center">'+svg+'</div>'
  +'</div>';
}

// ── BAR HELPER ─────────────────────────────────────────
function barRow(label,pct,color,valText){
  var safe=clamp(safeNum(pct,50),0,100);
  return '<div class="bar-row">'
    +'<span class="bar-lbl">'+label+'</span>'
    +'<div class="bar-track"><div class="bar-fill" style="width:0%;background:'+color+'" data-target="'+safe+'%"></div></div>'
    +'<span class="bar-val" style="color:'+color+'">'+valText+'</span>'
  +'</div>';
}

// 兩隊對比 bar：從中線各自往兩側長出去，數值愈好（lowerIsBetter 決定方向）該側愈長
function dualBarRow(label,awayVal,homeVal,fmt,lowerIsBetter){
  var av=safeNum(awayVal,null), hv=safeNum(homeVal,null);
  var awayC='var(--c)', homeC='var(--g)';
  var awayTxt=av!=null?fmt(av):'--', homeTxt=hv!=null?fmt(hv):'--';
  var awayShare=50, homeShare=50;
  if(av!=null&&hv!=null&&(av+hv)>0){
    var awayGood=lowerIsBetter?(1/Math.max(av,0.01)):av;
    var homeGood=lowerIsBetter?(1/Math.max(hv,0.01)):hv;
    awayShare=clamp((awayGood/(awayGood+homeGood))*100,15,85);
    homeShare=100-awayShare;
  }
  return '<div class="bar-row dual">'
    +'<span class="bar-lbl">'+label+'</span>'
    +'<span class="bar-val bar-val-l" style="color:'+awayC+'">'+awayTxt+'</span>'
    +'<div class="bar-track dual-track">'
      +'<div class="bar-fill bar-fill-l" style="width:0%;background:'+awayC+'" data-target="'+(awayShare/2)+'%"></div>'
      +'<div class="bar-fill bar-fill-r" style="width:0%;background:'+homeC+'" data-target="'+(homeShare/2)+'%"></div>'
    +'</div>'
    +'<span class="bar-val" style="color:'+homeC+'">'+homeTxt+'</span>'
  +'</div>';
}

// ── ADVANCED STATS（進階數據）─────────────────────────────
// 把 bot 已經算好、但卡片上沒地方放的欄位（球場因子/主審/CLV/WHIP/主客場勝率…）
// 整理成一個可展開區塊；每個欄位都是選填，缺值就不顯示，全部缺就整段不顯示
var SP_SRC_LABEL={probable:'推測（尚未正式公布）',confirmed:'✅ 已確認',gamefeed:'✅ 官方確認',lineup:'✅ 打線卡確認'};

  if(value==null||value==='')return '';
  return '<div class="adv-item"><span class="adv-lbl">'+label+'</span><span class="adv-val">'+value+'</span></div>';
}
function advStatsSection(idx,pick,awAb,hmAb){
  var pf=safeNum(pick.park_factor,null);
  // game-level：跟兩隊都無關（球場、主審、CLV、模型機率…），維持原本 2 欄流式排列
  var gameItems=[
    advKV('球場因子',pf!=null?(pf.toFixed(2)+(pf>1.02?'（打者有利）':pf<0.98?'（投手有利）':'（中性）')):null),
    advKV('主審',pick.ump_name?(pick.ump_name+(pick.ump_adj!=null?'　'+(pick.ump_adj>=0?'+':'')+safeNum(pick.ump_adj,0).toFixed(2):'')):null),
    advKV('先發狀態',SP_SRC_LABEL[pick.sp_src]||null),
    advKV('收線變化 CLV',pick.line_clv!=null?((pick.line_clv>=0?'+':'')+safeNum(pick.line_clv,0).toFixed(2)+'%'):null),
    advKV('模型勝率',pick.model_p!=null?safeNum(pick.model_p,0).toFixed(1)+'%':null),
    advKV('市場真實機率',pick.dv_p!=null?(safeNum(pick.dv_p,0)*100).toFixed(1)+'%':null),
  ].filter(Boolean);
  // team-level：客隊、主隊各自獨立一欄，不要交錯排列，一眼就知道是哪隊的數據
  var awayItems=[
    advKV('投手 WHIP',pick.away_whip!=null?safeNum(pick.away_whip,0).toFixed(2):null),
    advKV('投手場均局數',pick.away_avgip!=null?safeNum(pick.away_avgip,0).toFixed(1):null),
    advKV('客場勝率',pick.away_road_wpct!=null?(safeNum(pick.away_road_wpct,0)*100).toFixed(0)+'%':null),
    advKV('連續移動',pick.away_road_days!=null?pick.away_road_days+' 天':null),
    advKV('投手滯壘率 LOB%',pick.away_lob!=null?safeNum(pick.away_lob,0).toFixed(1)+'%':null),
    advKV('投手 BABIP',pick.away_babip!=null?safeNum(pick.away_babip,0).toFixed(3):null),
    advKV('投手休息天數',pick.away_rest!=null?pick.away_rest+' 天':null),
    advKV('跨時區',pick.away_tz_cross?'⚠️ 是':null),
  ].filter(Boolean);
  var homeItems=[
    advKV('投手 WHIP',pick.home_whip!=null?safeNum(pick.home_whip,0).toFixed(2):null),
    advKV('投手場均局數',pick.home_avgip!=null?safeNum(pick.home_avgip,0).toFixed(1):null),
    advKV('主場勝率',pick.home_wpct!=null?(safeNum(pick.home_wpct,0)*100).toFixed(0)+'%':null),
    advKV('投手滯壘率 LOB%',pick.home_lob!=null?safeNum(pick.home_lob,0).toFixed(1)+'%':null),
    advKV('投手 BABIP',pick.home_babip!=null?safeNum(pick.home_babip,0).toFixed(3):null),
    advKV('投手休息天數',pick.home_rest!=null?pick.home_rest+' 天':null),
  ].filter(Boolean);
  if(!gameItems.length&&!awayItems.length&&!homeItems.length)return '';
  var gameHtml=gameItems.length?('<div class="adv-game">'+gameItems.join('')+'</div>'):'';
  var teamHtml=(awayItems.length||homeItems.length)?(
    '<div class="adv-teams">'
      +(awayItems.length?('<div class="adv-col"><div class="adv-col-hdr">'+awAb+'（客）</div>'+awayItems.join('')+'</div>'):'')
      +(homeItems.length?('<div class="adv-col"><div class="adv-col-hdr">'+hmAb+'（主）</div>'+homeItems.join('')+'</div>'):'')
    +'</div>'

  return '<div class="gc-adv-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="adv-'+idx+'" onclick="toggleAdv(\''+idx+'\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleAdv(\''+idx+'\')}">'
      +'<span>📊 進階數據</span><span class="gc-lu-arrow" id="adv-arrow-'+idx+'">▾</span>'
    +'</div>'
    +'<div class="gc-adv" id="adv-'+idx+'" style="display:none">'+gameHtml+teamHtml+'</div>';
}

// ── MAKE GAME CARD ─────────────────────────────────────
function makeGCard(pick,idx,showCharts,liveGame,isTop){
  var awCn=pick.away_cn||pick.away||'客';
  var hmCn=pick.home_cn||pick.home||'主';
  var awAb=TEAM_ABBR[awCn]||abbr(awCn)||(pick.away||'').slice(0,3).toUpperCase()||'AWY';
  var hmAb=TEAM_ABBR[hmCn]||abbr(hmCn)||(pick.home||'').slice(0,3).toUpperCase()||'HME';
  var awTid=tid(awCn);
  var hmTid=tid(hmCn);

  // bet team detection
  var betOnH=!!(pick.bet_label&&pick.home_cn&&pick.bet_label.includes(pick.home_cn));

  // win probability
  var aiW=safeNum(pick.model_p,null);
  var homeWP,awayWP;
  if(aiW!=null){
    homeWP=betOnH?Math.round(aiW):Math.round(100-aiW);
    awayWP=100-homeWP;
  } else {
    homeWP=50;awayWP=50;
  }

  // tier
  var tierKey=pick.tier||'⭐ 穩定';
  var isGold=tierKey==='💎 強注'||tierKey==='🔥 強力';
  var btType=BM[pick.btype]||'ML';

  // odds
  var decOdds=safeNum(pick.bp,null);
  var usOdds=decOdds?fmtOddsUS(decOdds):'';
  var oddsStr=decOdds?('@'+decOdds.toFixed(2)):'';

  // bars
  var edgeV=safeNum(pick.edge,0);
  var confV=safeNum(pick.conf,0);
  var wxPct=pick.weather_factor!=null?clamp(safeNum(pick.weather_factor,0)*100,0,100):50;

  // kelly
  var stakeV=safeNum(pick.stake,null);
  var kv=stakeV!=null?('$'+stakeV.toFixed(0)):kelly(edgeV,decOdds);

  // predicted score
  var pAway=safeNum(pick.pred_away,null);
  var pHome=safeNum(pick.pred_home,null);

  // pitcher stats
  function pitStats(era,fip,k9){
    var parts=[];
    if(era!=null)parts.push('ERA '+era.toFixed(2));
    if(k9!=null)parts.push('K/9 '+k9.toFixed(1));
    if(fip!=null)parts.push('FIP '+fip.toFixed(2));
    return parts.join(' · ');
  }
  // 投手近況走勢：近2場ERA-前3場ERA，<0代表近期改善、>0代表近期惡化（見 mlb_bot_v101.py era_trend）
  function pitTrend(trend){
    var t=safeNum(trend,null);
    if(t==null||Math.abs(t)<0.3)return '';
    var improving=t<0;
    var color=improving?'var(--g)':'var(--r)';
    return '<div class="pit-trend" style="color:'+color+'">'+(improving?'↓ 近況轉佳':'↑ 近況降溫')+'</div>';
  }

  var h='<div class="gc fi'+(isGold?' tier-gold':'')+'>';

  // card header
  var liveBadge='';
  if(liveGame){
    var lAw=safeNum(liveGame.away_runs,0),lHm=safeNum(liveGame.home_runs,0);
    var lInn=(liveGame.top_inning?'▲':'▼')+(liveGame.inning||'?')+'局';
    liveBadge='<span class="gc-live-badge"><span class="live-dot-sm"></span>'+lAw+'-'+lHm+' '+lInn+'</span>';
  }
  h+='<div class="gc-hdr"><div class="gc-hdr-l"><div class="gc-hdr-badges">'
    +tierBadge(tierKey)
    +(isTop?'<span class="gc-top-tag">🏆 今日優勢 #1</span>':'')
    +liveBadge
    +'</div></div><div class="gc-time">'+(pick.game_time||'--:--')+'</div></div>';

  // teams row
  h+='<div class="gc-teams">'
    +'<div class="gc-team">'
    +(awTid?('<img class="gc-tl" src="https://www.mlbstatic.com/team-logos/'+awTid+'.svg" alt="'+awCn+'" loading="lazy" onerror="this.style.display=\'none\'">'):'  <div class="gc-tl" style="display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--t2)">'+awAb+'</div>')
    +'<span class="gc-ab">'+awAb+'</span>'
    +'<span class="gc-cn">'+awCn+'</span>'
    +'</div>'
    +'<span class="gc-vs">VS</span>'
    +'<div class="gc-team">'
    +(hmTid?('<img class="gc-tl" src="https://www.mlbstatic.com/team-logos/'+hmTid+'.svg" alt="'+hmCn+'" loading="lazy" onerror="this.style.display=\'none\'">'):'  <div class="gc-tl" style="display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--t2)">'+hmAb+'</div>')
    +'<span class="gc-ab">'+hmAb+'</span>'
    +'<span class="gc-cn">'+hmCn+'</span>'
    +'</div>'
  +'</div>';

  // win probability row
  var awayC=awayWP>55?'var(--g)':awayWP>50?'var(--c)':'var(--t2)';
  var homeC=homeWP>55?'var(--g)':homeWP>50?'var(--c)':'var(--t2)';
  h+='<div class="gc-wp">'
    +'<div class="gc-wp-side">'
    +'<div class="gc-wp-pct" style="color:'+awayC+'">'+awayWP+'%</div>'
    +'<div class="gc-wp-lbl">客隊勝率</div>'
    +'</div>'
    +wpDonut(awayWP,homeWP,awAb,hmAb)
    +'<div class="gc-wp-side">'
    +'<div class="gc-wp-pct" style="color:'+homeC+'">'+homeWP+'%</div>'
    +'<div class="gc-wp-lbl">主隊勝率</div>'
    +'</div>'
  +'</div>';

  // pitcher row
  h+='<div class="gc-pit">'
    +'<div class="gc-pit-side">'
    +pitcherAv(pick.away_sp,'a')
    +'<div class="pit-name">'+(pick.away_sp||'TBD')+(pick.away_hand?' <span class="pit-hand">'+pick.away_hand+'</span>':'')+'</div>'
    +'<div class="pit-stats">'+pitStats(pick.away_era,pick.away_fip,pick.away_k9)+'</div>'
    +pitTrend(pick.away_trend)
    +'</div>'
    +'<span class="pit-vs">⚾</span>'
    +'<div class="gc-pit-side">'
    +pitcherAv(pick.home_sp,'h')
    +'<div class="pit-name">'+(pick.home_sp||'TBD')+(pick.home_hand?' <span class="pit-hand">'+pick.home_hand+'</span>':'')+'</div>'
    +'<div class="pit-stats">'+pitStats(pick.home_era,pick.home_fip,pick.home_k9)+'</div>'
    +pitTrend(pick.home_trend)
    +'</div>'
  +'</div>';

  // lineup（先發打線，Pre-Game 卡公布後才有資料，兩隊都沒有時不顯示這段）
  h+=lineupSection(idx,awAb,hmAb,pick.away_lineup,pick.home_lineup);

  // bet row
  h+='<div class="gc-bet">'
    +'<span class="bt-badge '+btType+'">'+btType+'</span>'
    +'<span class="bet-label">'+(pick.bet_label||'')+'</span>'
    +(decOdds?('<span class="bet-odds">'+oddsStr+'</span>'):'' )
    +(usOdds?('<span class="bet-odds" style="color:var(--c);font-size:11px;margin-left:2px">('+usOdds+')</span>'):'')
    +(pick.bk?('<span class="bet-bk">'+pick.bk+'</span>'):'')
  +'</div>';

  // bars — 前三個改成兩隊對比（原本只顯示合併後的單一數字，看不出兩隊差異）
  h+='<div class="gc-bars">'
    +dualBarRow('近10戰',pick.away_l10_wpct,pick.home_l10_wpct,function(v){return (v*100).toFixed(0)+'%'},false)
    +dualBarRow('先發 ERA',pick.away_era,pick.home_era,function(v){return v.toFixed(2)},true)
    +dualBarRow('場均得分',pick.away_rpg,pick.home_rpg,function(v){return v.toFixed(1)},false)
    +barRow('WEATHER ADJ',wxPct,'var(--t2)','--')
  +'</div>';

  // metrics
  var edgeColor=edgeV>=15?'var(--g)':edgeV>=10?'var(--c)':'var(--y)';
  var confColor=confV>=75?'var(--g)':confV>=60?'var(--c)':'var(--y)';
  h+='<div class="gc-metrics">'
    +'<div class="gc-metric"><div class="gm-lbl">優勢值</div><div class="gm-val" style="color:'+edgeColor+'">'+edgeV.toFixed(1)+'%</div></div>'
    +'<div class="gc-metric"><div class="gm-lbl">信心度</div><div class="gm-val" style="color:'+confColor+'">'+confV.toFixed(1)+'%</div></div>'
    +'<div class="gc-metric"><div class="gm-lbl">Kelly</div><div class="gm-val" style="color:var(--y)">'+kv+'</div></div>'
  +'</div>';

  // predicted score
  if(pAway!=null&&pHome!=null){
    h+='<div class="gc-score">'
      +'<span class="gs-lbl">預測比分</span>'
      +'<span class="gs-val"><span class="gs-away">'+pAway.toFixed(1)+'</span> <span class="gs-sep">–</span> <span class="gs-home">'+pHome.toFixed(1)+'</span></span>'
    +'</div>';
  }

  // advanced stats（球場因子/主審/CLV/WHIP/主客場勝率…，有值才顯示；每項都標明是哪隊投手）
  h+=advStatsSection(idx,pick,awAb,hmAb);

  // charts (first 2 picks only)
  if(showCharts){
    h+='<div class="gc-charts">'
      +monteCarloChart(edgeV,confV)
      +runsDistChart(pAway,pHome)
    +'</div>';
  }

  h+='</div>';
  return h;
}

// ── TREND CHART（累計勝率／ROI 走勢）──────────────────────
var _trendPoints={};  // uid -> points array，供 hover 事件查值用
function trendChartBox(uid,points,key,color,suffix,title){
  var vals=points.map(function(p){return p[key]});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max){min-=1;max+=1}
  var W=300,H=60,PAD=4;
  var pts=points.map(function(p,i){
    var x=points.length>1?(i/(points.length-1))*W:W/2;
    var y=H-PAD-((p[key]-min)/(max-min))*(H-PAD*2);
    return [x,y];
  });
  var path='M '+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' L ');
  var last=points[points.length-1];
  var lastVal=last[key];
  var valTxt=(key==='roi'?(lastVal>=0?'+':''):'')+lastVal.toFixed(1)+suffix;
  var valColor=key==='roi'?(lastVal>=0?'var(--g)':'var(--r)'):color;
  // 只有 1 個資料點時畫不出線，改畫一個固定的點，不然圖表區塊會整個空白
  var singleDot=points.length===1?('<circle cx="'+pts[0][0].toFixed(1)+'" cy="'+pts[0][1].toFixed(1)+'" r="3" fill="'+color+'"/>'):'';
  _trendPoints[uid]=points;
  return '<div class="trend-box" data-uid="'+uid+'" data-key="'+key+'" data-suffix="'+suffix+'" data-color="'+color+'">'
    +'<div class="trend-hdr"><span class="trend-title">'+title+'</span><span class="trend-val" style="color:'+valColor+'">'+valTxt+'</span></div>'
    +'<svg class="trend-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'
      +'<path d="'+path+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'
      +singleDot
      +'<line class="trend-cross" x1="0" y1="0" x2="0" y2="'+H+'" stroke="rgba(20,20,43,.2)" style="display:none"/>'
      +'<circle class="trend-dot" r="3" fill="'+color+'" style="display:none"/>'
      +'<rect class="trend-hit" x="0" y="0" width="'+W+'" height="'+H+'" fill="transparent"/>'
    +'</svg>'
    +'<div class="trend-tip"><div class="trend-tip-date"></div><div class="trend-tip-val"></div></div>'
  +'</div>';
}
function initTrendCharts(){
  document.querySelectorAll('.trend-box[data-uid]').forEach(function(box){
    var uid=box.getAttribute('data-uid');
    var points=_trendPoints[uid];
    if(!points||!points.length)return;
    var key=box.getAttribute('data-key');
    var suffix=box.getAttribute('data-suffix');
    var svg=box.querySelector('.trend-svg');
    var path=box.querySelector('path');
    var cross=box.querySelector('.trend-cross');
    var dot=box.querySelector('.trend-dot');
    var tip=box.querySelector('.trend-tip');
    var tipDate=tip.querySelector('.trend-tip-date');
    var tipVal=tip.querySelector('.trend-tip-val');
    var W=300,H=60;
    function onMove(clientX){
      var rect=svg.getBoundingClientRect();
      var frac=clamp((clientX-rect.left)/rect.width,0,1);
      var idx=Math.round(frac*(points.length-1));
      var p=points[idx];
      var x=points.length>1?(idx/(points.length-1))*W:W/2;
      var vals=points.map(function(pt){return pt[key]});
      var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
      if(min===max){min-=1;max+=1}
      var y=H-4-((p[key]-min)/(max-min))*(H-8);
      cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.display='block';
      dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.style.display='block';
      var pctLeft=(x/W*100);
      tip.style.left=pctLeft+'%';
      tipDate.textContent=p.date;
      var v=p[key];
      tipVal.textContent=(key==='roi'&&v>=0?'+':'')+v.toFixed(1)+suffix+'（'+p.settled+' 場）';
      tip.classList.add('on');
    }
    function onLeave(){
      cross.style.display='none';dot.style.display='none';tip.classList.remove('on');
    }
    box.addEventListener('mousemove',function(e){onMove(e.clientX)});
    box.addEventListener('mouseleave',onLeave);
    box.addEventListener('touchmove',function(e){if(e.touches[0]){onMove(e.touches[0].clientX);e.preventDefault()}},{passive:false});
    box.addEventListener('touchend',onLeave);
  });
}

  var divisions=(key==='all'&&raw.length&&!raw[0].teams)?[{division_cn:'全聯盟',teams:raw}]:raw;

// ── TICKER ─────────────────────────────────────────────
function buildTicker(picks,history){
  var parts=[];
  if(picks&&picks.length){
    picks.forEach(function(p){
      var betOnH=!!(p.bet_label&&p.home_cn&&p.bet_label.includes(p.home_cn));
      var betCn=betOnH?(p.home_cn||p.home||''):(p.away_cn||p.away||'');
      var betAb=TEAM_ABBR[betCn]||abbr(betCn);
      var bt=BM[p.btype]||'ML';
      var dec=safeNum(p.bp,null);
      parts.push('<span class="tk-item">⚾ <b>'+betAb+' '+betCn+'</b> '+bt+(dec?' <span class="tk-odds">@'+dec.toFixed(2)+'</span>':'')+'</span><span class="tk-sep">·</span>');
    });
  }
  if(history&&history.length){
    history.slice(0,8).forEach(function(r){
      var awCn=r.away_cn||r.away||'客';
      var hmCn=r.home_cn||r.home||'主';
      var price=safeNum(r.price,null);
      parts.push('<span class="tk-item"><span class="tk-'+(r.result==='W'?'w':'l')+'">'+r.result+'</span> '+awCn+' vs '+hmCn+(price?' <span class="tk-odds">@'+price.toFixed(2)+'</span>':'')+'</span><span class="tk-sep">·</span>');
    });
  }
  if(!parts.length){parts.push('<span class="tk-item">MLB AI 預測引擎 · 今日數據更新中...</span>')}
  var inner=parts.join('')+parts.join('');
  document.getElementById('ticker-inner').innerHTML=inner;
}

// ── SCROLL REVEAL (subtle only — no opacity hide) ──────
var _fo=null;
function initScrollReveal(){
  if(!window.IntersectionObserver)return;
  if(_fo){_fo.disconnect()}
  _fo=new IntersectionObserver(function(entries){
    entries.forEach(function(x){if(x.isIntersecting)x.target.classList.add('on')});
  },{threshold:0.02,rootMargin:'0px 0px 80px 0px'});
  document.querySelectorAll('.fi:not(.on)').forEach(function(el){_fo.observe(el)});
}

// ── BAR ANIMATION ─────────────────────────────────────
function animateBars(){
  var bars=document.querySelectorAll('.bar-fill');
  bars.forEach(function(bar){
    var target=bar.getAttribute('data-target')||'0%';
    setTimeout(function(){bar.style.width=target},50);
  });
}

// ── PITCHER PHOTOS ─────────────────────────────────────
function initPitcherPhotos(){
  document.querySelectorAll('.pit-av[data-pname]').forEach(function(el){
    var name=el.getAttribute('data-pname');
    if(!name||name==='TBD')return;
    tryLocalCache(name,el);
  });
}

// 先試本機快取（bot 每日跑完後存的 docs/images/pitchers/，同源、免等 API），
// 失敗（尚未快取到這位投手）再 fallback 到即時 MLB API + CDN。
function tryLocalCache(name,el){
  var fname=name.trim().replace(/[^a-zA-Z0-9]/g,'_')+'.jpg';
  var url='images/pitchers/'+fname;
  var inner=el.querySelector('.pit-inner');
  if(!inner)return;
  var img=new Image();
  img.onload=function(){
    inner.innerHTML='<img src="'+url+'" alt="'+name+'" style="width:100%;height:100%;object-fit:cover;border-radius:6px">';
  };
  img.onerror=function(){tryMlbCdn(name,el)};
  img.src=url;
}

function tryMlbCdn(name,el){
  var url='https://statsapi.mlb.com/api/v1/people/search?names='+encodeURIComponent(name)+'&sportId=1&fields=people,id,fullName,primaryPosition,active';
  fetch(url,{signal:AbortSignal.timeout?AbortSignal.timeout(4000):undefined}).then(function(r){return r.json()}).then(function(d){
    var people=d&&d.people;
    if(!people||!people.length)return;
    var active=people.filter(function(p){return p.active});
    var person=(active.length?active[0]:people[0]);
    if(!person||!person.id)return;
    var imgUrl=cdnUrl(person.id);
    var inner=el.querySelector('.pit-inner');
    if(!inner)return;
    var img=new Image();
    img.onload=function(){
      inner.innerHTML='<img src="'+imgUrl+'" alt="'+name+'" style="width:100%;height:100%;object-fit:cover;border-radius:6px">';
    };
    img.onerror=function(){};
    img.src=imgUrl;
  }).catch(function(){});
}

// ── LIVE PAGE ──────────────────────────────────────────
function renderLivePage(live,updatedAt){
  var el=document.getElementById('live-page-content');
  if(!el)return;
  if(!live||!live.length){
    el.innerHTML='<div class="empty"><div class="empty-icon">⚾</div><p>目前沒有進行中的比賽</p></div>';
    return;
  }
  var h='<div class="sec-hdr fi"><div class="sec-title"><span class="sec-dot live-dot"></span>場中即時比分</div><span class="sec-count">'+live.length+' 場</span></div>';
  if(updatedAt)h+='<div style="font-size:10px;color:var(--t2);margin-bottom:10px">更新：'+updatedAt+'</div>';
  live.forEach(function(g){
    var hasBet=g.bet&&g.bet!==null;
    var awRuns=safeNum(g.away_runs,0);
    var hmRuns=safeNum(g.home_runs,0);
    var awColor=awRuns>hmRuns?'var(--g)':'var(--t1)';
    var hmColor=hmRuns>awRuns?'var(--g)':'var(--t1)';
    var awCn=g.away_cn||'客';
    var hmCn=g.home_cn||'主';
    var awAb=TEAM_ABBR[awCn]||abbr(awCn);
    var hmAb=TEAM_ABBR[hmCn]||abbr(hmCn);
    var innStr=(g.top_inning?'▲':'▼')+' '+(g.inning||'?')+' 局';
    h+='<div class="live-card fi'+(hasBet?' has-bet':'')+'">';
    h+='<div class="live-score">';
    h+='<div class="live-team">';
    h+=logoImg(awCn,40);
    h+='<span style="font-size:12px;font-weight:800;color:var(--t1);letter-spacing:.5px">'+awAb+'</span>';
    h+='<span class="live-tn">'+awCn+'</span>';
    h+='<span class="live-runs" style="color:'+awColor+'">'+awRuns+'</span>';
    h+='</div>';
    h+='<div class="live-mid">';
    h+='<span class="live-dash">–</span>';
    h+='<span class="live-inn">'+innStr+'</span>';
    h+='</div>';
    h+='<div class="live-team">';
    h+=logoImg(hmCn,40);
    h+='<span style="font-size:12px;font-weight:800;color:var(--t1);letter-spacing:.5px">'+hmAb+'</span>';
    h+='<span class="live-tn">'+hmCn+'</span>';
    h+='<span class="live-runs" style="color:'+hmColor+'">'+hmRuns+'</span>';
    h+='</div>';
    h+='</div>';
    h+='<div class="live-totals">';
    h+=(g.projected_total!=null?('<span class="live-chip">模型預測總分 <b style="color:var(--c)">'+safeNum(g.projected_total,0).toFixed(1)+'</b></span>'):'')
    h+=(g.market_total!=null?('<span class="live-chip">市場大小 <b style="color:var(--t1)">'+safeNum(g.market_total,0).toFixed(1)+'</b></span>'):'')
    h+=(hasBet?('<span class="live-chip bet">💡 '+g.bet+'</span>'):'')
    h+='</div>';
    h+=(g.reason?('<div class="live-reason">'+g.reason+'</div>'):'')
    h+='</div>';
  });
  el.innerHTML=h;
  initScrollReveal();
}

// ── PAGE SWITCH ────────────────────────────────────────
function showPg(n,btn){
  document.querySelectorAll('.pg').forEach(function(p){p.classList.remove('on')});
  document.querySelectorAll('.htab').forEach(function(b){b.classList.remove('on')});
  document.getElementById('pg'+n).classList.add('on');
  if(btn) btn.classList.add('on');
  _curPage=n;
  // lazy render
  if(n===3&&_data&&_data.recent_history){renderRecentHistory(_data.recent_history,_data.history_trend);initTrendCharts()}
  if(n===2&&_data){renderDataCenter(_data)}
  if(n===4&&!window._standingsLoaded){loadStandings()}
  if(n===5&&_data){renderLivePage(_data.live_games||[],_data.live_updated_at)}
  setTimeout(function(){initScrollReveal();animateBars()},100);
}

// ── HELPERS ───────────────────────────────────────────
function forceRefresh(){window.location.href=window.location.pathname+'?v='+Date.now()}
function _sbBase(){return (localStorage.getItem('mlb_supabase_url')||'').replace(/\/$/,'')}
function _sbFetch(path,fallback){
  var base=_sbBase();
  var urls=base?[base+'/storage/v1/object/public/picks/'+path,fallback]:[fallback];
  return (function tryNext(list){
    if(!list.length)return Promise.reject(new Error('all sources failed'));
    return fetch(list[0]+'?t='+Date.now()).then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
    }).catch(function(){return tryNext(list.slice(1));});
  })(urls);
}

// ── TRIGGER MODAL ─────────────────────────────────────
function openModal(){
  var base=_sbBase();
  document.getElementById('modal-desc').textContent=base
    ?'輸入觸發密語（TRIGGER_SECRET），透過 Supabase Edge Function 觸發 Bot。'
    :'輸入 GitHub Personal Access Token 來手動觸發資料更新工作流程。';
  document.getElementById('gh-token').placeholder=base?'trigger secret (可留空)':'ghp_xxxxxxxxxxxx';
  var saved=base?localStorage.getItem('mlb_trigger_secret'):localStorage.getItem('mlb_gh_token');
  document.getElementById('gh-token').value=saved||'';
  document.getElementById('modal-bg').classList.add('open');
}
function closeModal(){document.getElementById('modal-bg').classList.remove('open');document.getElementById('modal-msg').innerHTML=''}
function triggerBot(){
  var base=_sbBase();
  var tok=(document.getElementById('gh-token').value||'').trim();
  document.getElementById('modal-msg').innerHTML='<span style="color:var(--y)">⏳ 觸發中...</span>';
  if(base){
    // Supabase Edge Function 觸發（不需要 GitHub）
    var url=base+'/functions/v1/trigger-bot';
    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({secret:tok})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.ok){
          if(tok)localStorage.setItem('mlb_trigger_secret',tok);
          document.getElementById('modal-msg').innerHTML='<span style="color:var(--g)">✅ 已成功觸發！Bot 執行中，約 3 分鐘後資料更新。</span>';
        } else throw new Error(d.error||'unknown');
      }).catch(function(e){
        document.getElementById('modal-msg').innerHTML='<span style="color:var(--r)">❌ 失敗：'+e.message+'</span>';
      });
  } else {
    // 原 GitHub API 觸發
    if(!tok){document.getElementById('modal-msg').innerHTML='<span style="color:var(--r)">請輸入 Token</span>';return}
    fetch('https://api.github.com/repos/willy0931926721-hub/MLB/actions/workflows/mlb_bot.yml/dispatches',{
      method:'POST',
      headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json','Accept':'application/vnd.github+json'},
      body:JSON.stringify({ref:'main'})
    }).then(function(r){
      if(r.status===204||r.ok){
        localStorage.setItem('mlb_gh_token',tok);
        document.getElementById('modal-msg').innerHTML='<span style="color:var(--g)">✅ 已成功觸發！工作流程執行中。</span>';
      } else return r.json().then(function(d){throw new Error(d.message||r.status)});
    }).catch(function(e){
      document.getElementById('modal-msg').innerHTML='<span style="color:var(--r)">❌ 失敗：'+e.message+'</span>';
    });
  }
}

// ── SETTINGS MODAL ────────────────────────────────────
function openSettings(){
  document.getElementById('sb-url').value=localStorage.getItem('mlb_supabase_url')||'';
  document.getElementById('sb-secret').value=localStorage.getItem('mlb_trigger_secret')||'';
  document.getElementById('sb-ghtoken').value=localStorage.getItem('mlb_gh_token')||'';
  document.getElementById('settings-msg').innerHTML='';
  document.getElementById('settings-bg').classList.add('open');
}
function closeSettings(){document.getElementById('settings-bg').classList.remove('open')}
function saveSettings(){
  var url=(document.getElementById('sb-url').value||'').trim().replace(/\/$/,'');
  var secret=(document.getElementById('sb-secret').value||'').trim();
  var ghTok=(document.getElementById('sb-ghtoken').value||'').trim();
  if(url)localStorage.setItem('mlb_supabase_url',url); else localStorage.removeItem('mlb_supabase_url');
  if(secret)localStorage.setItem('mlb_trigger_secret',secret); else localStorage.removeItem('mlb_trigger_secret');
  if(ghTok)localStorage.setItem('mlb_gh_token',ghTok); else localStorage.removeItem('mlb_gh_token');
  document.getElementById('settings-msg').innerHTML='<span style="color:var(--g)">✅ 已儲存。請重整頁面讓設定生效。</span>';
  setTimeout(function(){closeSettings();forceRefresh();},1200);
}

// ── LOAD STANDINGS ─────────────────────────────────────
function loadStandings(){
  window._standingsLoaded=true;
  _sbFetch('standings.json','./standings.json').then(function(d){
    renderStandings(d);
  }).catch(function(e){
    document.getElementById('std-content').innerHTML='<div class="error-banner">⚠️ 無法載入排名資料：'+e.message+'</div>';
  });
}

// ── MAIN LOAD ─────────────────────────────────────────
function renderAll(data){
  _data=data;
  // 優勢值由高到低排序，最值得看的推薦永遠排最前面
  var picks=(data.picks||[]).slice().sort(function(a,b){return safeNum(b.edge,0)-safeNum(a.edge,0)});
  _allPicks=picks;
  _liveByKey=buildLiveLookup(data.live_games);
  renderTopEdge(picks);
  renderQuickStats(data.stats);
  var upEl=document.getElementById('home-updated');
  if(upEl)upEl.innerHTML=data.generated_at?'<div style="font-size:10px;color:var(--t2);text-align:right;margin:-4px 0 8px;padding-right:2px">🤖 資料更新：'+data.generated_at+'</div>':'';
  renderPicksSection(picks,'home-picks-section');
  var aiEl=document.getElementById('ai-picks-section');
  if(picks.length){
    var h='<div class="sec-hdr fi"><div class="sec-title"><span class="sec-dot"></span>AI 深度分析</div><span class="sec-count">'+picks.length+' 場</span></div>';
    h+='<div class="filter-bar">'
      +'<button class="ftab on" onclick="doFilter(\'all\',this)">全部 ('+picks.length+')</button>'
      +'<button class="ftab" onclick="doFilter(\'ML\',this)">獨贏 ML</button>'
      +'<button class="ftab" onclick="doFilter(\'RL\',this)">讓分 RL</button>'
      +'<button class="ftab" onclick="doFilter(\'TOT\',this)">大小分 TOT</button>'
    +'</div>';
    h+='<div id="picks-list-ai-picks-section">';
    picks.forEach(function(p,i){h+=makeGCard(p,'ai-picks-section-'+i,i<2,liveGameFor(p),i===0)});
    h+='</div>';
    aiEl.innerHTML=h;
  } else {
    aiEl.innerHTML='<div class="empty"><div class="empty-icon">⚾</div><p>今日暫無 AI 分析</p></div>';
  }
  buildTicker(picks,data.recent_history||[]);
  setTimeout(function(){animateBars();initPitcherPhotos()},200);
  if(_curPage===5)renderLivePage(data.live_games||[],data.live_updated_at);
}

(function init(){
  var pb=document.getElementById('pb');
  pb.style.width='30%';
  var _done=false;

  // clear any stale cache from previous versions
  try{localStorage.removeItem('mlb_picks_cache');}catch(e){}

  // 20s hard fallback — skeleton can never stay forever
  setTimeout(function(){
    if(_done)return;
    _done=true;
    pb.style.opacity='0';
    var pks=document.getElementById('home-picks-section');
    if(pks&&pks.querySelector('.sk'))
      pks.innerHTML='<div class="empty"><div class="empty-icon">📡</div><p>載入超時，請按 ↻ 重新整理</p></div>';
  },20000);

  // fetch fresh data — Supabase first, fallback to relative path
  var _sbBase=(localStorage.getItem('mlb_supabase_url')||'').replace(/\/$/,'');
  var _urls=_sbBase
    ?[_sbBase+'/storage/v1/object/public/picks/picks_latest.json','./picks_latest.json']
    :['./picks_latest.json'];
  (function tryNext(urls){
    if(!urls.length){
      _done=true;pb.style.opacity='0';
      document.getElementById('home-te').innerHTML='<div class="error-banner">⚠️ 無法載入數據（GitHub/Supabase 均無法連線）<br><small style="color:var(--t2)">請點 ⚙️ 設定 Supabase URL，或等待網路恢復。</small></div>';
      document.getElementById('home-picks-section').innerHTML='<div class="empty"><div class="empty-icon">📡</div><p>數據載入失敗</p></div>';
      buildTicker([],[]);return;
    }
    var url=urls[0];var rest=urls.slice(1);
    var ctrl2=typeof AbortController!=='undefined'?new AbortController():null;
    if(ctrl2)setTimeout(function(){ctrl2.abort()},12000);
    fetch(url+(url.indexOf('?')<0?'?t=':'.t=')+Date.now(),ctrl2?{signal:ctrl2.signal}:{})
      .then(function(r){pb.style.width='100%';if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(data){
        _done=true;setTimeout(function(){pb.style.opacity='0'},300);
        try{renderAll(data);}catch(err){
          document.getElementById('home-picks-section').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><p>渲染錯誤，請按 ↻ 重新整理</p></div>';
        }
      })
      .catch(function(){tryNext(rest);});
  })(_urls);
})();
</script>
