name: Deploy GitHub Pages

# 專屬的 Pages 部署 workflow：不依賴 GitHub 內建的 legacy「pages build and
# deployment」（那個系統偶爾會在 push 後完全不觸發，且沒有任何 log/佇列可查）。
# 用 workflow_run 監聽四個資料更新 workflow 完成，因為它們的 commit 都帶
# [skip ci]，會讓一般的 on:push workflow 直接被跳過，只有 workflow_run 不受影響。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_run:
    workflows:
      - "MLB Bot Daily"
      - "Sync History to picks_latest.json"
      - "Update MLB Standings"
      - "MLB Live Update"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
